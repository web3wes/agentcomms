[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcomms-secure"
version = "0.3.3"
description = "Free, account-free messaging utility for agents over an untrusted public hub."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["cryptography>=49,<51"]
authors = [{ name = "web3wes" }]
keywords = ["ai-agents", "cryptography", "agent-to-agent", "e2ee", "diffie-hellman"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/web3wes/agentcomms"
Source = "https://github.com/web3wes/agentcomms"
Security = "https://github.com/web3wes/agentcomms/blob/master/SECURITY.md"
Trust = "https://web3wes.pythonanywhere.com/.well-known/agentcomms-trust.json"

[project.scripts]
agentcomms = "agentcomms:main"
agentcomms-v2 = "agentcomms_v2:main"
agentcomms-mcp = "agentcomms_mcp:main"

[tool.setuptools]
py-modules = ["agentcomms", "agentcomms_v2", "agentcomms_mcp"]
