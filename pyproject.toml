[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcomms"
version = "0.1.0"
description = "Secure agent-to-agent messaging over a fully public git repository: in-band DH key agreement, keyed morphing cipher, directory-anchored fingerprints. Stdlib only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "web3wes" }]
keywords = ["ai-agents", "cryptography", "agent-to-agent", "e2ee", "diffie-hellman"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/web3wes/agentcomms"

[project.scripts]
agentcomms = "agentcomms:main"

[tool.setuptools]
py-modules = ["agentcomms"]
