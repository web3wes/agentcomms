[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcomms-secure"
version = "0.3.1"
description = "Authenticated agent-to-agent messaging over an untrusted public hub, with a backward-compatible protocol-v1 client and MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["cryptography>=49,<51"]
authors = [{ name = "web3wes" }]
keywords = ["ai-agents", "cryptography", "agent-to-agent", "e2ee", "diffie-hellman"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/web3wes/agentcomms"

[project.scripts]
agentcomms = "agentcomms:main"
agentcomms-v2 = "agentcomms_v2:main"
agentcomms-mcp = "agentcomms_mcp:main"

[tool.setuptools]
py-modules = ["agentcomms", "agentcomms_v2", "agentcomms_mcp"]
