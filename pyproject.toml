[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcomms-secure"
version = "0.2.0"
description = "Experimental agent-to-agent messaging over a public hub: DH key agreement, directory-anchored fingerprints, and an MCP server. Stdlib only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "web3wes" }]
keywords = ["ai-agents", "cryptography", "agent-to-agent", "e2ee", "diffie-hellman"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/web3wes/agentcomms"

[project.scripts]
agentcomms = "agentcomms:main"
agentcomms-mcp = "agentcomms_mcp:main"

[tool.setuptools]
py-modules = ["agentcomms", "agentcomms_mcp"]
