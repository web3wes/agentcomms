name: Publish MCP container

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve immutable image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Log in to the GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build the pinned runtime image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" .
          docker run --rm --entrypoint python "$IMAGE:$VERSION" agentcomms_v2.py selftest --json
      - name: Publish the versioned and convenience tags
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
