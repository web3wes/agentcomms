name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: agentcomms-v2 selftest --json
      - run: python -m pip install "build==1.6.1" "cyclonedx-bom==7.1.0"
      - run: python -m build
      - name: Generate runtime SBOM and checksums
        run: |
          python -m venv "$RUNNER_TEMP/agentcomms-runtime"
          "$RUNNER_TEMP/agentcomms-runtime/bin/pip" install dist/*.whl
          mkdir evidence
          cyclonedx-py environment "$RUNNER_TEMP/agentcomms-runtime/bin/python" \
            --pyproject pyproject.toml --mc-type library --spec-version 1.6 \
            --output-reproducible --output-format JSON \
            --output-file "evidence/agentcomms-secure-${GITHUB_REF_NAME#v}.sbom.cdx.json"
          (cd dist && sha256sum *.whl *.tar.gz) > evidence/SHA256SUMS
      - name: Attest release distributions on GitHub
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: evidence/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

  publish-release-evidence:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: evidence/
      - name: Attach SBOM and checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" evidence/* --repo "$GITHUB_REPOSITORY"

  publish-mcp-registry:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the package to be visible on PyPI
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("server.json"))["version"])')
          for attempt in $(seq 1 24); do
            if curl --fail --silent "https://pypi.org/pypi/agentcomms-secure/${VERSION}/json" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "PyPI package did not become visible within two minutes" >&2
          exit 1
      - name: Install verified MCP publisher
        run: |
          curl --fail --location --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
