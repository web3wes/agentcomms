name: Security evidence

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install project and evidence tools
        run: python -m pip install . "pip-audit==2.10.1" "ruff==0.17.1"
      - name: Static checks
        run: ruff check --select E9,F63,F7,F82 .
      - name: Unit and cryptographic vector checks
        run: |
          python -m unittest discover -s tests -v
          agentcomms-v2 selftest --json
      - name: Audit installed dependencies
        run: |
          python -m venv "$RUNNER_TEMP/agentcomms-audit"
          "$RUNNER_TEMP/agentcomms-audit/bin/pip" install .
          "$RUNNER_TEMP/agentcomms-audit/bin/python" -m pip uninstall --yes pip setuptools
          pip-audit --path "$RUNNER_TEMP/agentcomms-audit/lib/python3.12/site-packages" \
            --format json --output pip-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audit
          path: pip-audit.json

  codeql:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
